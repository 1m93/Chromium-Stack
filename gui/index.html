<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EngineShelf</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="booting">
    <div class="app">
      <header class="bar">
        <div class="brand">
          <img src="icon.svg" width="22" height="22" alt="" />
          <span>EngineShelf</span>
        </div>
        <span class="host mono" id="host"></span>
        <div class="spacer"></div>

        <div
          class="gauge"
          id="gauge"
          title="Disk used by downloaded browsers, their profiles and Docker images"
        >
          <span data-icon="disk"></span>
          <span id="disk-text">—</span>
          <span class="gauge-bar">
            <i id="disk-seg-browsers"></i><i id="disk-seg-profiles"></i
            ><i id="disk-seg-docker"></i>
          </span>
        </div>

        <button
          class="btn check-btn"
          id="check-btn"
          title="What EngineShelf found on this machine"
        >
          <span data-icon="warn"></span
          ><span id="check-label">System check</span>
        </button>

        <button class="btn icon-btn" id="theme-btn" title="Light / dark">
          <span data-icon="theme"></span>
        </button>
      </header>

      <!-- Only rendered when something is missing, or when asked for from the header. -->
      <section id="doctor" class="doctor" hidden></section>

      <section class="launch">
        <div class="control grow">
          <span class="control-icon accent-ink" data-icon="link"></span>
          <span class="control-label">Every launch opens</span>
          <input
            type="text"
            id="url"
            class="mono"
            placeholder="localhost:4173"
            autocomplete="off"
            spellcheck="false"
          />
          <button class="linkish" id="url-clear" hidden>clear</button>
        </div>

        <div class="control">
          <span class="control-icon" data-icon="frame"></span>
          <input
            type="text"
            id="size"
            class="size-input"
            placeholder="auto"
            autocomplete="off"
            spellcheck="false"
            title="Window size, e.g. 1280x800"
          />
        </div>

        <div class="drop" id="gpu-drop">
          <button class="btn drop-btn tall" id="gpu-btn">
            <span class="control-icon" data-icon="gpu"></span>
            <span id="gpu-label">GPU auto</span>
            <span class="caret" data-icon="caret-down"></span>
          </button>
          <div class="menu" id="gpu-menu" hidden></div>
        </div>
      </section>

      <div class="split">
        <nav class="side">
          <!-- Filters and eras describe the list; the matrix has neither, so both
               groups are hidden there rather than left showing counts that
               belong to a view nobody is looking at. -->
          <div class="side-group" id="filters-group">
            <div class="side-title">Shelf</div>
            <button class="side-btn is-on" data-filter="all">
              <span data-icon="grid"></span
              ><span class="side-label">All versions</span
              ><span class="count mono" data-count="all"></span>
            </button>
            <button class="side-btn" data-filter="installed">
              <span data-icon="ok"></span
              ><span class="side-label">Installed</span
              ><span class="count mono" data-count="installed"></span>
            </button>
            <button class="side-btn" data-filter="running">
              <span data-icon="play-circle"></span
              ><span class="side-label">Running</span
              ><span class="count mono" data-count="running"></span>
            </button>
            <button
              class="side-btn"
              data-filter="rosetta"
              id="filter-rosetta"
              hidden
            >
              <span data-icon="gpu"></span
              ><span class="side-label">Rosetta only</span
              ><span class="count mono" data-count="rosetta"></span>
            </button>
          </div>

          <div class="side-group" id="eras-group">
            <div class="side-title">Jump to era</div>
            <div id="eras"></div>
          </div>

          <!-- Four engines share one shelf, so this is a filter in the list -
               most of the time you are after one of them. The matrix has nothing
               to filter, so there it reads out how much of each is on disk. -->
          <div class="side-group" id="engines-group">
            <div class="side-title">Engines</div>
            <div id="engine-list"></div>
          </div>

          <div class="spacer"></div>

          <div class="disk-card">
            <div class="side-title">Disk</div>
            <div class="disk-bar">
              <i id="card-seg-browsers"></i><i id="card-seg-profiles"></i
              ><i id="card-seg-docker"></i>
            </div>
            <div class="disk-line">
              <span class="swatch browsers"></span>Browsers<span
                class="mono"
                id="disk-browsers"
                >—</span
              >
            </div>
            <div class="disk-line">
              <span class="swatch profiles"></span>Profiles<span
                class="mono"
                id="disk-profiles"
                >—</span
              >
            </div>
            <div class="disk-line" id="disk-docker-line" hidden>
              <span class="swatch docker"></span>Docker<span
                class="mono"
                id="disk-docker"
                >—</span
              >
            </div>
          </div>
        </nav>

        <main class="main" id="main">
          <div class="toolbar">
            <div class="search">
              <span data-icon="search"></span>
              <input
                type="text"
                id="query"
                placeholder="Filter by engine, version or feature"
                autocomplete="off"
                spellcheck="false"
              />
              <button class="iconish" id="query-clear" hidden title="Clear">
                <span data-icon="x"></span>
              </button>
            </div>
            <span class="summary" id="summary"></span>
            <div class="spacer"></div>
            <!-- Four engines number their releases differently and none of the
                 numbers line up, so the matrix compares them by year instead.
                 The list stays for filtering and for the per-row actions. -->
            <div class="viewswitch" role="group" aria-label="View">
              <button class="btn viewbtn" id="view-list" aria-pressed="true">
                <span class="control-icon" data-icon="rows"></span>List
              </button>
              <button class="btn viewbtn" id="view-matrix" aria-pressed="false">
                <span class="control-icon" data-icon="grid"></span>By year
              </button>
            </div>
            <span class="sort-label">Sort</span>
            <div class="drop" id="sort-drop">
              <button class="btn drop-btn" id="sort-btn">
                <span class="control-icon" data-icon="sort"></span>
                <span id="sort-label">Newest first</span>
                <span class="caret" data-icon="caret-down"></span>
              </button>
              <div class="menu" id="sort-menu" hidden></div>
            </div>
          </div>

          <div id="matrix" hidden></div>
          <div id="list" aria-busy="true"></div>
          <div class="tail"></div>
        </main>
      </div>

      <section class="logpanel" id="log-panel" hidden>
        <div class="logpanel-head">
          <span class="side-title">Job log</span>
          <div class="log-tabs" id="log-tabs"></div>
          <strong id="log-title"></strong>
          <span class="log-status" id="log-status"></span>
          <div class="spacer"></div>
          <button class="btn warn log-cancel" id="log-cancel" hidden>
            <span data-icon="x" id="log-cancel-icon"></span
            ><span id="log-cancel-label">Cancel</span>
          </button>
          <button class="iconish" id="log-close" title="Close">
            <span data-icon="x"></span>
          </button>
        </div>
        <pre id="log-out"></pre>
      </section>

      <footer class="status">
        <span class="dot" id="job-dot" data-state="idle"></span>
        <span class="job-title" id="job-title">Ready</span>
        <span class="job-detail mono" id="job-detail"></span>
        <span class="job-bar" id="job-bar" hidden
          ><i id="job-bar-fill"></i
        ></span>
        <button class="job-more" id="job-more" hidden></button>
        <div class="spacer"></div>
        <button class="btn" id="log-btn">
          <span data-icon="terminal"></span
          ><span id="log-btn-label">Show log</span>
        </button>
        <span class="foot-path" id="foot-path"></span>
        <span class="rule"></span>
        <a
          class="foot-by"
          href="https://github.com/1m93"
          target="_blank"
          rel="noopener noreferrer"
          >@1m93</a
        >
      </footer>
    </div>

    <dialog id="note-dialog">
      <form method="dialog" class="dialog-body">
        <div>
          <h2 id="note-title">Changelog</h2>
          <p class="muted" id="note-text"></p>
        </div>
        <menu class="dialog-actions">
          <button class="btn" value="cancel">Close</button>
        </menu>
      </form>
    </dialog>

    <dialog id="confirm-dialog">
      <form method="dialog" class="dialog-body">
        <div>
          <h2 id="confirm-title"></h2>
          <p class="muted" id="confirm-body"></p>
        </div>
        <menu class="dialog-actions">
          <button class="btn" value="cancel">Cancel</button>
          <button class="btn danger" id="confirm-ok" value="ok"></button>
        </menu>
      </form>
    </dialog>

    <div class="toast" id="toast" hidden>
      <span id="toast-icon" data-icon="ok"></span><span id="toast-text"></span>
    </div>

    <template id="row-template">
      <article class="row">
        <span class="dot" data-dot></span>
        <span data-engine></span>
        <div class="row-id">
          <div class="row-title" data-title></div>
          <div class="row-rev mono" data-rev></div>
        </div>
        <div class="row-body">
          <p class="row-note" data-note></p>
          <div class="row-tags" data-tags></div>
        </div>
        <!-- Two lines, one per copy of this version on disk: the native build
             and the container image. The top line used to be the version, which
             only Chromium ever had a different one of - it reads under the name
             now, where every other engine has always put it. -->
        <!-- Two lines, one per copy of this version on disk, each marked with
             the same glyph its route uses: a screen for the native build, a cube
             for the container image. The words "Docker" and "Native" were there
             first and the column is 170px wide - the second line came out as
             "er 898 MB". -->
        <div class="row-meta mono">
          <span class="row-size" data-size hidden></span>
          <span class="row-size" data-size-docker hidden></span>
        </div>
        <div class="row-progress" data-progress hidden>
          <i data-progress-bar></i>
        </div>
        <div class="row-actions" data-actions></div>
      </article>
    </template>

    <!-- One tooltip for the whole page, moved to whatever is hovered. The row
         marks say what they mean in here rather than in a title attribute: a
         title waits a second, cannot be styled, and on a shelf where the marks
         are the only words left that second is the whole answer. -->
    <div class="tip" id="tip" role="tooltip" hidden></div>

    <script src="app.js"></script>
  </body>
</html>
