# Keeps the landing page's download links pointing at the newest release.
# The page reads docs/release.json first and only falls back to the GitHub API,
# so a published release updates the site without touching any HTML.
name: Refresh landing page release data

on:
  release:
    types: [published, edited, deleted]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: landing-release-data
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write docs/release.json from the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/releases/latest" --jq '{
            tag_name,
            body,
            published_at,
            assets: [.assets[] | {name, size, browser_download_url}]
          }' > docs/release.json
          cat docs/release.json

      - name: Commit when it changed
        run: |
          if git diff --quiet -- docs/release.json; then
            echo "release.json already current — nothing to do"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/release.json
          git commit -m "chore: refresh landing page release data"
          git push
