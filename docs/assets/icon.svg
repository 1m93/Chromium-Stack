<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
<!-- ChromiumStack app icon, full detail. Three stacked browser windows, the
     front one showing the manager's shelf: a dot for each version's state and
     the one button that acts on it. The silhouette says "browser", the stack
     says "more than one version", the rows say "and you choose which".
     Colours are the app's own tokens. Used for 64px and up - below that the
     rows turn to mush, so icon-small.svg takes over.
     Raster forms: tools/make-icons.sh. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#6b97ff"/><stop offset="1" stop-color="#2545c4"/>
    </linearGradient>
    <clipPath id="c"><rect x="168" y="330" width="688" height="452" rx="52"/></clipPath>
  </defs>
  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <rect x="330" y="196" width="404" height="300" rx="42" fill="#ffffff" opacity="0.22"/>
  <rect x="268" y="262" width="528" height="330" rx="46" fill="#ffffff" opacity="0.38"/>
  <g clip-path="url(#c)">
    <rect x="168" y="330" width="688" height="452" fill="#ffffff"/>
    <rect x="168" y="330" width="688" height="104" fill="#1b2230"/>
    <circle cx="228" cy="382" r="17" fill="#ffffff" opacity="0.9"/>
    <circle cx="286" cy="382" r="17" fill="#ffffff" opacity="0.6"/>
    <circle cx="344" cy="382" r="17" fill="#ffffff" opacity="0.35"/>
    <rect x="424" y="364" width="372" height="36" rx="18" fill="#ffffff" opacity="0.22"/>

    <!-- shelf rows: state, version, button -->
    <circle cx="238" cy="513" r="15" fill="#3fbd7d"/>
    <rect x="278" y="497" width="264" height="32" rx="16" fill="#5a6579" opacity="0.72"/>
    <rect x="628" y="489" width="164" height="48" rx="16" fill="#5c8dff"/>

    <circle cx="238" cy="613" r="15" fill="#5c8dff"/>
    <rect x="278" y="597" width="208" height="32" rx="16" fill="#5a6579" opacity="0.5"/>
    <rect x="628" y="589" width="164" height="48" rx="16" fill="#5c8dff" opacity="0.34"/>

    <circle cx="238" cy="713" r="15" fill="#9aa6bb" opacity="0.8"/>
    <rect x="278" y="697" width="244" height="32" rx="16" fill="#5a6579" opacity="0.34"/>
    <rect x="628" y="689" width="164" height="48" rx="16" fill="#5c8dff" opacity="0.16"/>
  </g>
</svg>
